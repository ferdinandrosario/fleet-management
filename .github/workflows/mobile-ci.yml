name: Mobile CI

# Blocking gates: typecheck, ESLint, and Jest with the coverage threshold
# (mobile/jest.config.js). Matches the local commands in docs/mobile/setup.md.

on:
  push:
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26.5.1"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests + coverage gate
        run: npm test -- --coverage
